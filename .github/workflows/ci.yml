name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 그대로 설치한다 (npm install과 달리 버전을 바꾸지 않음)
      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build
